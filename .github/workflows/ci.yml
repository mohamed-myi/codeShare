name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Verify complete baseline
        run: pnpm verify:benchmark

      - name: Check shuffled test stability
        run: pnpm test:stability

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results
          path: test-results/
          retention-days: 7

      - name: Upload client dist
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: apps/client/dist/
          retention-days: 7
